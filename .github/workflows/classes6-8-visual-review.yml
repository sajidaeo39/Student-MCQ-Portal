name: Classes 6-8 Visual Review Packs
on:
  workflow_dispatch:
  push:
    paths:
      - 'Question bank.pdf'
      - 'scripts/build_classes6_8_review_packs.py'
      - '.github/workflows/classes6-8-visual-review.yml'
permissions:
  contents: read
jobs:
  review-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-urd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pymupdf
      - name: Build review packs
        run: python scripts/build_classes6_8_review_packs.py
      - uses: actions/upload-artifact@v4
        with:
          name: classes6-8-visual-review-packs
          path: |
            class6-review/
            class7-review/
            class8-review/
          if-no-files-found: error
          retention-days: 30
