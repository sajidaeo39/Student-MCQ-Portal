name: Class 3 Visual Page Review

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/render_class3_contact_sheets.py"
      - ".github/workflows/class3-visual-review.yml"

permissions:
  contents: read

jobs:
  render-class3-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF and image libraries
        run: python -m pip install --upgrade pymupdf pillow

      - name: Render original Class 3 candidate pages
        run: python scripts/render_class3_contact_sheets.py

      - name: Upload page images and contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: class3-visual-review
          path: class3-visual-review/
          if-no-files-found: error
          retention-days: 30
