<body>
<div id="portal-loader"><h2>PECTAA SMART PRACTICE PORTAL</h2><p id="load-status">Loading the updated portal and MCQ database…</p><progress id="load-progress" max="16" value="0"></progress></div>
<script>
(async()=>{
 const parts=[".portal-deploy-parts/part-001.txt",".portal-deploy-parts/part-002.txt",".portal-deploy-parts/part-003.txt",".portal-deploy-parts/part-004.txt",".portal-deploy-parts/part-005.txt",".portal-deploy-parts/part-006.txt",".portal-deploy-parts/part-007.txt",".portal-deploy-parts/part-008.txt",".portal-deploy-parts/part-009.txt",".portal-deploy-parts/part-010.txt",".portal-deploy-parts/part-011.txt",".portal-deploy-parts/part-012.txt",".portal-deploy-parts/part-013.txt",".portal-deploy-parts/part-014.txt",".portal-deploy-parts/part-015.txt",".portal-deploy-parts/part-016.txt"];
 const chunks=[];
 const status=document.getElementById('load-status');
 const progress=document.getElementById('load-progress');
 try{
  for(let i=0;i<parts.length;i++){
   const response=await fetch('./'+parts[i]+'?v=20261122-navigation-recovery-v97',{cache:'no-store'});
   if(!response.ok) throw new Error('Could not load portal data part '+(i+1)+' (HTTP '+response.status+').');
   chunks.push(await response.text());
   progress.value=i+1;
   status.textContent='Loading portal data… '+(i+1)+' / '+parts.length;
  }
  const html=chunks.join('');
  if(!html.includes('</html>')||!html.includes('<!DOCTYPE')&&!html.includes('<!doctype')) throw new Error('The assembled portal file appears incomplete.');
  document.open();document.write(html);document.close();
 }catch(error){
  status.textContent='Portal could not be loaded: '+error.message+' Please refresh or contact the portal administrator.';
  progress.remove();
 }
})();
</script>
<script>
/* Register offline support as early as possible on GitHub Pages. */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => reg.update().catch(() => {}))
      .catch(err => console.warn('Offline support registration failed:', err));
  }, { once: true });
}
</script>
